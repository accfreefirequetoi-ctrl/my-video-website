<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>GIF</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="stage" id="stage">
    <img id="mainGif" class="video" src="videos/reaction.gif" alt="GIF đang phát">
    <canvas id="frozenFrame" class="video" hidden aria-label="GIF đã phát xong"></canvas>
    <div class="message" id="message" role="status">
      <p id="messageText">Đang tải GIF…</p>
      <button id="startButton" type="button" hidden>Bắt đầu</button>
    </div>
    <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Bật toàn màn hình">Toàn màn hình</button>
  </main>
  <script src="script.js?v=2"></script>
</body>
</html>
